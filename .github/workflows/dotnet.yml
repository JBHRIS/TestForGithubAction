# This workflow will build a .NET project and deploy to Azure VM IIS
name: .NET CI/CD Pipeline

on:
  push:
    branches: ['master', 'For-portal-CICD']
  pull_request:
    branches: ['master', 'For-portal-CICD']

jobs:
  ci:
    name: CI Pipeline
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration Release

      - name: Publish artifacts
        run: dotnet publish --no-build --configuration Release --output ./publish

      - name: Upload published artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./publish

  cd:
    name: CD Pipeline
    needs: ci
    runs-on: windows-latest
    if: github.event_name == 'push' # 只在 push 執行部署

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download published artifacts
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: ./publish

      - name: Deploy to IIS
        run: |
          $websiteName = '${{ secrets.IIS_SITE_NAME }}'
          $appName = '${{ secrets.IIS_APP_NAME }}'
          $deployUrl = 'https://20.205.99.114:8172/MSDeploy.axd'
          $username = '${{ secrets.AZURE_VM_USERNAME }}'
          $password = '${{ secrets.AZURE_VM_PASSWORD }}'

          Write-Host "部署到網站: $websiteName" -ForegroundColor Cyan
          Write-Host "應用程式名稱: $appName" -ForegroundColor Cyan

          $destPath = "$websiteName/$appName"

          msdeploy -verb:sync -source:contentPath='./publish' -dest:contentPath="$destPath" -dest:ComputerName="$deployUrl" -dest:UserName="$username" -dest:Password="$password" -dest:AuthType="Basic" -allowUntrusted
        shell: powershell

      - name: Deployment Summary
        run: |
          echo "Deployment completed successfully!"
          echo "Deployed to IIS site: ${{ secrets.IIS_SITE_NAME }}"
          echo "Source path: ./publish"
        shell: powershell
