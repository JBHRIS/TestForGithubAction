# This workflow will build a .NET project and deploy to Azure VM IIS
name: .NET CI/CD Pipeline

on:
  push:
    branches: ['master', 'For-portal-CICD']
  pull_request:
    branches: ['master', 'For-portal-CICD']

jobs:
  ci:
    name: CI Pipeline
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration Release

      - name: Publish artifacts
        run: dotnet publish --no-build --configuration Release --output ./publish

      - name: Upload published artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./publish

  cd:
    name: CD Pipeline
    needs: ci
    runs-on: windows-latest
    if: github.event_name == 'push' # 只在 push 執行部署

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download published artifacts
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: ./publish

      - name: Install Web Deploy
        run: |
          Write-Host "Checking for Web Deploy installation..."
          $webDeployPath = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (Test-Path $webDeployPath) {
            Write-Host "Web Deploy found at: $webDeployPath"
          } else {
            Write-Host "Web Deploy not found. Installing..."
            choco install webdeploy -y
          }
        shell: powershell

      - name: Test MSDeploy Connection
        env:
          DEPLOY_URL: 'https://20.205.99.114:8172/MSDeploy.axd'
          DEPLOY_USERNAME: ${{ secrets.AZURE_VM_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.AZURE_VM_PASSWORD }}
        run: |
          Write-Host "=== Testing MSDeploy Connection ==="
          Write-Host "URL: $env:DEPLOY_URL"
          Write-Host "Username: $env:DEPLOY_USERNAME"
          Write-Host "Testing connection..."

          $webDeployPath = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          & $webDeployPath -verb:getSystemInfo -dest:ComputerName=$env:DEPLOY_URL -dest:UserName=$env:DEPLOY_USERNAME -dest:Password=$env:DEPLOY_PASSWORD -dest:AuthType=Basic -allowUntrusted

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Connection SUCCESS!"
          } else {
            Write-Host "Connection FAILED. Error code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }
        shell: powershell

      - name: Show Test Results
        run: |
          Write-Host "=== Test Completed ==="
          Write-Host "If the connection test passed, uncomment the deployment steps below"
        shell: powershell

